name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.project.outputs.has_project }}
    steps:
      - uses: actions/checkout@v5
      - name: Check documentation and project presence
        id: project
        shell: bash
        run: |
          test -s README.md
          test -s SPEC.md
          if test -f Gazon.xcodeproj/project.pbxproj; then
            echo 'has_project=true' >> "$GITHUB_OUTPUT"
            echo 'Xcode project found; build and tests will run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'has_project=false' >> "$GITHUB_OUTPUT"
            echo 'Only the specification exists. No iOS build or tests ran.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-test:
    needs: check-project
    if: needs.check-project.outputs.has_project == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Clean and build for simulator
        run: |
          xcodebuild clean build \
            -project Gazon.xcodeproj -scheme Gazon \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/GazonDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iPhone app
        run: |
          xcodebuild build \
            -project Gazon.xcodeproj -scheme Gazon \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/GazonDevice" \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/GazonDevice/Build/Products/Release-iphoneos/Gazon.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Gazon-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: Gazon-unsigned-ipa
          path: ${{ runner.temp }}/Gazon-unsigned.ipa
          if-no-files-found: error
      - name: Prepare iOS Simulator for tests
        shell: bash
        run: |
          if ! xcrun simctl list devices available | grep -q 'iPhone'; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.5
          fi
          xcrun simctl list devices available
          xcrun simctl list runtimes
          if ! xcrun simctl list devices available | grep -q 'iPhone'; then
            xcrun simctl create GazonTest com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5
          fi
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"] and d["state"] != "Unavailable"))')"
          echo "GAZON_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Gazon.xcodeproj -scheme Gazon \
            -destination "platform=iOS Simulator,id=$GAZON_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/GazonDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/GazonTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: GazonTests-xcresult
          path: ${{ runner.temp }}/GazonTests.xcresult
          if-no-files-found: ignore
